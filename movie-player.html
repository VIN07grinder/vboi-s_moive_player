<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vboi's Movie Player</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Vboi's Movie Player</h1>
    <input type="text" id="tmdbId" placeholder="Enter TMDB ID">
    <button onclick="loadMovie()">Load Movie</button>
    <button onclick="launchFullscreenMovie()">Fullscreen Mode</button>
    <iframe id="movieFrame" width="100%" height="100%" frameborder="0" allowfullscreen></iframe>

    <script src="script.js"></script>
</body>
</html>
